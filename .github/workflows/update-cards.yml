name: update cards

on:
  schedule:
    # 00:30 UTC daily — 06:00 IST, after the previous day has closed.
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG cards
        env:
          # PROFILE_TOKEN is a classic PAT with read:user (and repo, if you want
          # private contributions counted). Falls back to GITHUB_TOKEN, which
          # only ever sees public activity.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: Spacey6849
          LEETCODE_USER: spacey6849
        run: node scripts/generate-cards.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh profile cards"
            git push
            exit 0
          fi

          # Nothing to publish. GitHub disables a scheduled workflow after 60
          # days without repository activity, which would silently freeze the
          # card. Rather than commit an empty change every day, only heartbeat
          # once the repo has been quiet for a while.
          age=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "assets unchanged; last commit ${age} day(s) ago"

          if [ "$age" -ge 25 ]; then
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run
            git add .github/last-run
            git commit -m "chore: heartbeat, keep the schedule armed"
            git push
          fi
